name: Release notes

on:
  push:
    branches: [main]
    paths: ["docs/releases/*.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publish new releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_releases.py
