name: X Post

on:
  schedule:
    # Tue & Thu 08:00 JST (Mon/Wed 23:00 UTC)
    - cron: "0 23 * * 1,3"
  workflow_dispatch:
    inputs:
      slug:
        description: "Optional draft slug to force (e.g. glossary-signup-cvr)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install tweepy python-frontmatter python-dotenv

      - name: Post to X
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          SITE_URL: https://sitekpi.net
          SLUG: ${{ inputs.slug }}
        run: python scripts/post_to_x.py

      - name: Record posted slug
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/posted_to_x.json
          if git diff --cached --quiet; then
            echo "No history change"
            exit 0
          fi
          git commit -m "chore(x): record posted slug"
          git push
