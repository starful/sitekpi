<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>設定</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&amp;family=IBM+Plex+Sans+JP:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#f4f6fa}
a{color:#1d4ed8}a:hover{color:#1e3a8a}
button{font-family:inherit}
.lang:hover{border-color:#9db8ea}
</style>
</helmet>
<div style="font-family: 'IBM Plex Sans JP', 'Noto Sans JP', system-ui, sans-serif; color: #152033; background: #f4f6fa; min-height: 800px; display: flex; flex-wrap: wrap; align-items: stretch">

  <nav aria-label="メニュー" style="flex: 0 1 248px; min-width: 220px; box-sizing: border-box; background: #ffffff; border-right: 1px solid #e5eaf1; padding: 20px 12px; display: flex; flex-direction: column; gap: 2px; font-size: 14px">
    <a href="01-home.dc.html" style="text-decoration: none; color: #152033; font-family: 'DM Sans', sans-serif; font-weight: 800; font-size: 22px; letter-spacing: -0.02em; padding: 0 8px 18px">Site<span style="color: #2f6fed">KPI</span></a>
    <div style="font-size: 11px; font-weight: 700; color: #5b6676; padding: 6px 10px 4px">マイサイト</div>
    <a href="03-board.dc.html" style="text-decoration: none; color: #152033; padding: 9px 10px; font-weight: 700">Demo Shop JP（デモ）</a>
    <div style="font-size: 11px; font-weight: 700; color: #5b6676; padding: 14px 10px 4px">ツール</div>
    <a href="06-builder.dc.html" style="text-decoration: none; color: #3d4a5c; padding: 8px 10px; font-weight: 600">ダッシュボードを作る</a>
    <a href="04-glossary.dc.html" style="text-decoration: none; color: #3d4a5c; padding: 8px 10px; font-weight: 600">指標辞典</a>
    <div style="font-size: 11px; font-weight: 700; color: #5b6676; padding: 14px 10px 4px">見本</div>
    <a href="05-samples.dc.html" style="text-decoration: none; color: #3d4a5c; padding: 8px 10px; font-weight: 600">見本ボード一覧</a>
    <div style="flex-grow: 1; min-height: 24px"></div>
    <a href="#top" style="text-decoration: none; color: #1d4ed8; background: #eef4ff; padding: 10px; border-radius: 8px; font-weight: 700; border-top: 1px solid #e5eaf1">設定</a>
  </nav>

  <main id="top" style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 40px clamp(16px, 3vw, 44px) 64px; display: flex; flex-direction: column; gap: 18px; max-width: 820px">
    <h1 style="margin: 0; font-size: 28px; font-weight: 700">設定</h1>

    <section style="background: #ffffff; border: 1px solid #e5eaf1; border-radius: 16px; padding: 22px 24px; display: flex; flex-direction: column; gap: 14px">
      <div>
        <h2 style="margin: 0; font-size: 16px; font-weight: 800">表示言語</h2>
        <p style="margin: 4px 0 0; font-size: 13px; line-height: 1.7; color: #5b6676">メニュー・表の見出し・説明・指標名が切り替わります。GA4 のイベント名（purchase など）とチャネル名（Organic Search など）はそのまま表示します。</p>
      </div>
      <div role="radiogroup" aria-label="表示言語" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
        <sc-for list="{{langs}}" as="l" hint-placeholder-count="3">
          <button type="button" role="radio" class="lang" aria-checked="{{l.checked}}" onClick="{{l.pick}}" style="{{l.style}}">
            <span aria-hidden="true" style="{{l.dot}}"></span>
            <span style="text-align: left"><b style="font-size: 15px">{{l.name}}</b><span style="display: block; font-size: 12px; color: #5b6676">{{l.sample}}</span></span>
          </button>
        </sc-for>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap">
        <button type="button" onClick="{{save}}" style="font: inherit; font-size: 14px; font-weight: 800; border: 0; border-radius: 10px; min-height: 44px; padding: 0 20px; background: {{accent}}; color: #ffffff; cursor: pointer">保存する</button>
        <sc-if value="{{saved}}" hint-placeholder-val="{{ false }}"><span role="status" style="font-size: 13px; font-weight: 700; color: #0f766e">✓ 保存しました</span></sc-if>
        <a href="03-board.dc.html" style="font-size: 13px; font-weight: 700; text-decoration: none; margin-left: auto">ボードに戻る</a>
      </div>
    </section>

    <section style="background: #ffffff; border: 1px solid #e5eaf1; border-radius: 16px; padding: 22px 24px; display: flex; flex-direction: column; gap: 10px">
      <h2 style="margin: 0; font-size: 16px; font-weight: 800">つないでいるサイト</h2>
      <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap">
        <span style="font-size: 14px"><b>Demo Shop JP（デモ）</b><span style="display: block; font-size: 12px; color: #5b6676">買う × EC・小売 · プロパティ 123456789</span></span>
        <span style="display: flex; gap: 8px">
          <a href="03-board.dc.html" style="display: inline-flex; align-items: center; min-height: 40px; padding: 0 14px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 13px; font-weight: 700; text-decoration: none">サイトの設定</a>
          <a href="02-connect.dc.html" style="display: inline-flex; align-items: center; min-height: 40px; padding: 0 14px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 13px; font-weight: 700; text-decoration: none">接続・切断</a>
        </span>
      </div>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2f6fed","options":["#2f6fed","#0f766e","#7c3aed","#152033"]},"$preview":{"width":1440,"height":800}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { lang: 'ja', saved: false };
  }
  renderVals() {
    var self = this, st = this.state;
    var accent = this.props.accent ?? '#2f6fed';
    var langs = [['ja', '日本語', 'いまの状態 · 業界目安'], ['en', 'English', 'Where you stand · Industry std.'], ['ko', '한국어', '지금 상태 · 업계 기준']].map(function (l) {
      var on = st.lang === l[0];
      return {
        name: l[1], sample: l[2], checked: on ? 'true' : 'false',
        pick: function () { self.setState({ lang: l[0], saved: false }); },
        style: 'font: inherit; color: inherit; display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 12px; cursor: pointer; min-height: 64px; border: 1.5px solid ' + (on ? accent : '#e5eaf1') + '; background: ' + (on ? '#f3f7fe' : '#ffffff'),
        dot: 'width: 18px; height: 18px; border-radius: 50%; flex: none; box-sizing: border-box; border: ' + (on ? '6px solid ' + accent : '2px solid #cbd5e1') + '; background: #ffffff'
      };
    });
    return { accent: accent, langs: langs, saved: st.saved, save: function () { self.setState({ saved: true }); } };
  }
}
</script>
</body>
</html>
